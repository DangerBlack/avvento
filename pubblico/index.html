<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4e9d5" />
  <title>Calendario dell'Avvento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4e9d5'/%3E%3Cpath d='M9 29V13a7 7 0 0 1 14 0v16z' fill='%23b57f7e' stroke='%2333291c' stroke-width='1.4'/%3E%3Ccircle cx='19.6' cy='21' r='1.4' fill='%23a8804a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="carta" aria-hidden="true">
    <span class="macchia macchia--1"></span>
    <span class="macchia macchia--2"></span>
  </div>

  <p class="nastro" id="nastro" hidden>modalità prova · tutte le porticine aperte</p>

  <div class="foglio">
    <header class="intestazione">
      <img class="frontespizio" src="/illustrazioni/frontespizio.webp" width="520" height="799" alt="" aria-hidden="true" />
      <p class="intestazione__occhiello" id="occhiello">Per te</p>
      <h1 class="intestazione__titolo" id="titolo">Calendario dell'Avvento</h1>
      <p class="intestazione__sotto" id="sottotitolo">venticinque porticine, venticinque nascondigli</p>
      <img class="fregio" src="/illustrazioni/fregio.webp" width="1100" height="184" alt="" aria-hidden="true" />
      <p class="intestazione__conteggio" id="conteggio" aria-live="polite"></p>
    </header>

    <main>
      <div class="griglia" id="griglia">
        <p class="caricamento">le porticine si stanno aprendo…</p>
      </div>
    </main>

    <footer class="piede">
      <p class="piede__nota">
        ogni porticina si apre solo nel suo giorno.
        dietro c'è un indizio, e l'indizio porta a un cioccolatino.
      </p>
      <button type="button" class="piede__azzera" id="azzera">ricomincia da capo</button>
    </footer>
  </div>

  <div class="velo" id="velo" hidden>
    <div class="teatro" id="teatro" role="dialog" aria-modal="true" aria-label="Porticina"></div>
  </div>

  <div class="avviso" id="avviso" role="status" aria-live="polite"></div>

  <!-- ======================================================================
       La porticina, disegnata una volta e riusata venticinque volte.
       Il colore arriva dalle variabili CSS --tinta e --tinta-fondo,
       il numero è un <text> accanto alla <use>, il motivo è simbolo.
       ====================================================================== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="taglio" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="3" seed="12" result="t" />
        <feDisplacementMap in="SourceGraphic" in2="t" scale="3.4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="penna" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.035 0.05" numOctaves="2" seed="31" result="t" />
        <feDisplacementMap in="SourceGraphic" in2="t" scale="2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="ombra" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="1.2" dy="2.6" stdDeviation="2.8" flood-color="#4b3a28" flood-opacity="0.2" />
      </filter>
      <filter id="morbido" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" />
      </filter>

      <linearGradient id="ombraDx" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0.45" stop-color="#33291c" stop-opacity="0" />
        <stop offset="1" stop-color="#33291c" stop-opacity="0.14" />
      </linearGradient>
      <linearGradient id="ombraGiu" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0.5" stop-color="#33291c" stop-opacity="0" />
        <stop offset="1" stop-color="#33291c" stop-opacity="0.12" />
      </linearGradient>

      <path id="sagoma" d="M58 360 L58 176 C58 118 96 90 150 90 C204 90 242 118 242 176 L242 360 Z" />
      <path id="cornice" fill-rule="evenodd"
            d="M43 375 L43 169 C43 100 91 72 150 72 C209 72 257 100 257 169 L257 375 Z
               M58 360 L58 176 C58 118 96 90 150 90 C204 90 242 118 242 176 L242 360 Z" />
      <clipPath id="dentro"><use href="#sagoma" /></clipPath>

      <symbol id="cornice-porta" viewBox="0 0 300 400">
        <ellipse cx="152" cy="370" rx="112" ry="8" fill="#5b4a35" opacity="0.16" filter="url(#morbido)" />
        <g filter="url(#ombra)">
          <use href="#cornice" fill="var(--cornice, #e6d8bd)" filter="url(#taglio)" />
        </g>
        <use href="#cornice" fill="none" stroke="#33291c" stroke-width="1.15" stroke-opacity="0.42" filter="url(#penna)" />
        <g filter="url(#penna)" stroke="#33291c" fill="#3a2d1c" fill-opacity="0.45">
          <rect x="48" y="212" width="8" height="16" rx="1" stroke-width="0.55" />
          <rect x="48" y="284" width="8" height="16" rx="1" stroke-width="0.55" />
        </g>
        <g filter="url(#penna)">
          <rect x="50" y="361" width="200" height="7" fill="var(--tinta-fondo, #7d524f)" fill-opacity="0.4" />
          <line x1="50" y1="361" x2="250" y2="361" stroke="#33291c" stroke-width="1.1" opacity="0.5" />
        </g>
      </symbol>

      <symbol id="anta-oblo" viewBox="0 0 300 400">
        <use href="#sagoma" fill="var(--tinta, #b57f7e)" filter="url(#taglio)" />
        <g clip-path="url(#dentro)">
          <rect x="58" y="90" width="184" height="270" fill="url(#ombraDx)" />
          <rect x="58" y="90" width="184" height="270" fill="url(#ombraGiu)" />
        </g>
        <g filter="url(#penna)">
          <circle cx="150" cy="158" r="27" fill="#f2e3bf" />
          <circle cx="150" cy="158" r="27" fill="#e9c98c" opacity="0.4" />
          <circle cx="150" cy="158" r="27" fill="none" stroke="#33291c" stroke-width="1.5" opacity="0.68" />
          <circle cx="150" cy="158" r="21" fill="none" stroke="#33291c" stroke-width="0.6" opacity="0.3" />
          <path d="M123 158 H177 M150 131 V185" stroke="#33291c" stroke-width="1.1" opacity="0.42" />
        </g>
        <g filter="url(#penna)">
          <circle cx="221" cy="316" r="7.4" fill="none" stroke="#8a6533" stroke-width="2.1" opacity="0.9" />
          <circle cx="221" cy="316" r="7.4" fill="none" stroke="#e3c391" stroke-width="0.8" opacity="0.7" />
          <circle cx="221" cy="308" r="2.1" fill="#c3a065" stroke="#7d5f31" stroke-width="0.45" />
        </g>
        <use href="#sagoma" fill="none" stroke="#33291c" stroke-width="1.25" opacity="0.62" filter="url(#penna)" />
      </symbol>

      <symbol id="anta-ramo" viewBox="0 0 300 400">
        <use href="#sagoma" fill="var(--tinta, #b57f7e)" filter="url(#taglio)" />
        <g clip-path="url(#dentro)">
          <rect x="58" y="90" width="184" height="270" fill="url(#ombraDx)" />
          <rect x="58" y="90" width="184" height="270" fill="url(#ombraGiu)" />
        </g>
        <g transform="translate(150 132) scale(0.92)" filter="url(#penna)" stroke="#33291c" fill="none" stroke-linejoin="round" stroke-linecap="round">
          <path d="M0 32 C-1 19 0 8 3 -4" stroke-width="1" opacity="0.75" />
          <path d="M0 23 C-9 21 -17 13 -20 3 C-10 2 -3 8 0 23 Z" fill="#e7dcc4" fill-opacity="0.55" stroke-width="0.95" />
          <path d="M0 23 C-7 17 -12 11 -18 4" stroke-width="0.45" opacity="0.55" />
          <path d="M3 11 C11 9 18 2 21 -8 C12 -7 5 -1 3 11 Z" fill="#e7dcc4" fill-opacity="0.5" stroke-width="0.95" />
          <path d="M3 11 C9 5 14 0 19 -6" stroke-width="0.45" opacity="0.55" />
          <path d="M3 -4 C-1 -13 -1 -23 3 -32 C7 -23 7 -13 3 -4 Z" fill="#e7dcc4" fill-opacity="0.45" stroke-width="0.95" />
          <path d="M3 -4 L3 -29" stroke-width="0.45" opacity="0.55" />
          <circle cx="-6.5" cy="31" r="2.3" fill="#8a3a33" fill-opacity="0.85" stroke-width="0.45" />
          <circle cx="4.5" cy="35" r="1.9" fill="#8a3a33" fill-opacity="0.8" stroke-width="0.45" />
        </g>
        <g filter="url(#penna)">
          <circle cx="221" cy="316" r="7.4" fill="none" stroke="#8a6533" stroke-width="2.1" opacity="0.9" />
          <circle cx="221" cy="316" r="7.4" fill="none" stroke="#e3c391" stroke-width="0.8" opacity="0.7" />
          <circle cx="221" cy="308" r="2.1" fill="#c3a065" stroke="#7d5f31" stroke-width="0.45" />
        </g>
        <use href="#sagoma" fill="none" stroke="#33291c" stroke-width="1.25" opacity="0.62" filter="url(#penna)" />
      </symbol>

    </defs>
  </svg>

  <script src="/js/app.js"></script>
</body>
</html>
